<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прогрес</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --link: var(--tg-theme-link-color, #007aff);
    --button: var(--tg-theme-button-color, #007aff);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --card-border: rgba(128, 128, 128, 0.16);
    --warn: #ff9500;

    /* єдина шкала відступів — усі gap/padding/margin у файлі беруться звідси */
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 24px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: var(--sp-4) var(--sp-4) var(--sp-5);
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 var(--sp-4); }
  h2 {
    font-size: 13px; font-weight: 600; margin: 0 0 var(--sp-3);
    color: var(--hint); text-transform: uppercase; letter-spacing: 0.04em;
  }
  .card {
    background: var(--secondary-bg);
    border-radius: 16px;
    padding: var(--sp-4);
    margin-bottom: var(--sp-4);
    border: 1px solid var(--card-border);
  }

  /* профіль: кожне поле — лейбл зверху, значення знизу. Один патерн для всіх
     полів (короткі й довгі) навмисно, замість row+stack впереміш — так
     відступи скрізь однакові незалежно від довжини тексту. */
  .field { margin-bottom: var(--sp-3); }
  .field:last-child { margin-bottom: 0; }
  .field .label {
    display: block; font-size: 12px; color: var(--hint);
    margin-bottom: var(--sp-1);
  }
  .field .value { font-size: 15px; }

  .chips { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .chip {
    background: var(--bg); border: 1px solid var(--card-border);
    border-radius: 999px; padding: var(--sp-1) var(--sp-3); font-size: 12px; line-height: 1.3;
  }

  .constraint {
    background: var(--bg); border-left: 3px solid var(--warn); border-radius: 8px;
    padding: var(--sp-2) var(--sp-3); font-size: 13px;
  }
  .constraint + .constraint { margin-top: var(--sp-2); }
  .constraint .tag {
    display: block; font-size: 11px; font-weight: 700; color: var(--warn);
    text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px;
  }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); margin-bottom: var(--sp-4); }
  .stat { background: var(--bg); border-radius: 12px; padding: var(--sp-3); text-align: center; }
  .stat .value { font-size: 20px; font-weight: 700; }
  .stat .label { font-size: 11px; color: var(--hint); margin-top: 2px; }

  select {
    width: 100%; padding: var(--sp-2) var(--sp-3); border-radius: 10px;
    border: 1px solid var(--card-border); background: var(--bg); color: var(--text);
    font-size: 14px; margin-bottom: var(--sp-3); -webkit-appearance: none; appearance: none;
  }

  .day-block { margin-bottom: var(--sp-4); }
  .day-block:last-child { margin-bottom: 0; }
  .day-title {
    font-weight: 700; font-size: 14px; margin-bottom: var(--sp-2);
    padding-bottom: var(--sp-1); border-bottom: 1px solid var(--card-border);
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: var(--sp-2) 0; border-bottom: 1px solid var(--card-border); vertical-align: baseline; }
  tr:last-child td { border-bottom: none; }
  td.ex-name { padding-right: var(--sp-3); }
  td.ex-sets {
    text-align: right; white-space: nowrap; color: var(--hint);
    font-variant-numeric: tabular-nums; width: 1%;
  }

  .empty { color: var(--hint); font-size: 13px; }
  #error { color: #ff3b30; padding: var(--sp-5) var(--sp-1); }
  canvas { max-width: 100%; }
</style>
</head>
<body>

<h1>Твій прогрес</h1>
<div id="content"></div>
<div id="error" style="display:none"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

function fmtKg(n) { return (Math.round(n * 10) / 10).toLocaleString('uk-UA'); }
function fmtTonnes(kg) { return (kg / 1000).toLocaleString('uk-UA', { maximumFractionDigits: 2 }); }

function chip(text) { return `<span class="chip">${text}</span>`; }

function field(label, value) {
  return `<div class="field"><span class="label">${label}</span><span class="value">${value}</span></div>`;
}

function renderProfile(profile) {
  const bm = profile.body_metrics || {};
  const measurements = Object.entries(bm.measurements || {});
  return `
    <div class="card">
      <h2>Профіль</h2>
      ${field("Ім'я", profile.name || '—')}
      ${field('Мета', profile.goals || '—')}
      ${field('Рівень', profile.level || '—')}
      ${field('Вага тіла', bm.weight_kg ? bm.weight_kg + ' кг' : '—')}
      ${profile.equipment && profile.equipment.length ? `
        <div class="field">
          <span class="label">Обладнання</span>
          <div class="chips">${profile.equipment.map(chip).join('')}</div>
        </div>` : ''}
      ${profile.constraints && profile.constraints.length ? `
        <div class="field">
          <span class="label">Обмеження</span>
          ${profile.constraints.map(c => `
            <div class="constraint"><span class="tag">${c.tag}</span>${c.note || ''}</div>`).join('')}
        </div>` : ''}
      ${measurements.length ? `
        <div class="field">
          <span class="label">Обхвати</span>
          <div class="chips">${measurements.map(([k, v]) => chip(`${k}: ${v}`)).join('')}</div>
        </div>` : ''}
    </div>`;
}

function renderProgram(program) {
  if (!program.name) {
    return `<div class="card"><h2>Програма</h2><div class="empty">Програму ще не складено</div></div>`;
  }
  const days = (program.days || []).map(d => `
    <div class="day-block">
      <div class="day-title">${d.day}</div>
      <table><tbody>
        ${(d.exercises || []).map(e => `
          <tr><td class="ex-name">${e.name}</td><td class="ex-sets">${e.sets || ''}×${e.reps || ''}</td></tr>`).join('')}
      </tbody></table>
    </div>`).join('');
  return `
    <div class="card">
      <h2>Програма — ${program.name}${program.type ? ' (' + program.type + ')' : ''}</h2>
      ${days}
    </div>`;
}

function renderStats(totalWorkouts, volumeSeries) {
  const totalKg = volumeSeries.reduce((s, v) => s + v.volume_kg, 0);
  return `
    <div class="card">
      <h2>Загальний тоннаж</h2>
      <div class="stat-grid">
        <div class="stat"><div class="value">${totalWorkouts}</div><div class="label">тренувань</div></div>
        <div class="stat"><div class="value">${fmtTonnes(totalKg)} т</div><div class="label">піднято всього</div></div>
      </div>
      <canvas id="volumeChart" height="180"></canvas>
    </div>`;
}

function renderExerciseSection(names) {
  if (!names.length) {
    return `<div class="card"><h2>Прогресія по вправах</h2><div class="empty">Ще немає записаних тренувань</div></div>`;
  }
  return `
    <div class="card">
      <h2>Прогресія по вправах</h2>
      <select id="exerciseSelect">${names.map(n => `<option value="${n}">${n}</option>`).join('')}</select>
      <canvas id="exerciseChart" height="180"></canvas>
    </div>`;
}

function drawVolumeChart(series) {
  const ctx = document.getElementById('volumeChart');
  if (!ctx || !series.length) return;
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: series.map(v => v.date),
      datasets: [{ label: 'Тоннаж, кг', data: series.map(v => v.volume_kg),
                   borderColor: getComputedStyle(document.body).getPropertyValue('--link'),
                   tension: 0.25, fill: false }]
    },
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });
}

let exerciseChart = null;
function drawExerciseChart(rows) {
  const ctx = document.getElementById('exerciseChart');
  if (!ctx) return;
  if (exerciseChart) exerciseChart.destroy();
  exerciseChart = new Chart(ctx, {
    data: {
      labels: rows.map(r => r.date),
      datasets: [
        { type: 'line', label: 'Макс. вага, кг', data: rows.map(r => r.top_weight_kg),
          borderColor: '#ff9500', yAxisID: 'y', tension: 0.25 },
        { type: 'bar', label: 'Обсяг, кг', data: rows.map(r => r.volume_kg),
          backgroundColor: 'rgba(0,122,255,0.35)', yAxisID: 'y1' },
      ]
    },
    options: {
      scales: {
        y: { position: 'left', title: { display: true, text: 'кг' } },
        y1: { position: 'right', grid: { drawOnChartArea: false } },
      }
    }
  });
}

async function load() {
  const initData = tg ? tg.initData : '';
  if (!initData) {
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = 'Відкрий цю сторінку через кнопку в боті — поза Telegram дані недоступні.';
    return;
  }
  let resp;
  try {
    resp = await fetch('/api/dashboard?initData=' + encodeURIComponent(initData));
  } catch (e) {
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = 'Не вдалося з’єднатися з сервером.';
    return;
  }
  if (!resp.ok) {
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = 'Помилка авторизації, відкрий сторінку заново через бота.';
    return;
  }
  const data = await resp.json();

  if (data.bot_name) {
    document.title = data.bot_name;
    document.querySelector('h1').textContent = `Твій прогрес — ${data.bot_name}`;
  }

  const names = Object.keys(data.exercise_progression);
  document.getElementById('content').innerHTML =
    renderStats(data.total_workouts, data.volume_series) +
    renderExerciseSection(names) +
    renderProfile(data.profile) +
    renderProgram(data.program);

  drawVolumeChart(data.volume_series);
  if (names.length) {
    drawExerciseChart(data.exercise_progression[names[0]]);
    document.getElementById('exerciseSelect').addEventListener('change', (e) => {
      drawExerciseChart(data.exercise_progression[e.target.value]);
    });
  }
}

load();
</script>
</body>
</html>
